version: '2'
sql:
  - engine: postgresql
    schema:
      - internal/storage/migrations/000001_initial.up.sql
      - internal/storage/migrations/000002_administrator.up.sql
    queries: internal/storage/queries.sql
    gen:
      go:
        package: db
        out: internal/storage/db
        sql_package: pgx/v5
        emit_empty_slices: true
