# Локальный стек `bash scripts/dev.sh start`: добавляется поверх production-файла compose из
# релиза, собранного из этой копии. Работают PostgreSQL, API с панелью на http://127.0.0.1:8080
# и Xray worker; Caddy, HAProxy и удалённый браузер выключены.
services:
  # Новый том принадлежит root, а API и Xray worker работают как 10001. dev.sh запускает эту
  # разовую службу перед стеком.
  state:
    profiles: [setup]
    image: private-gateway/api:${PG_API_IMAGE:?Set PG_API_IMAGE}
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/state"]
    network_mode: none
    volumes:
      - state:/state
    restart: "no"

  api:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Без Caddy noVNC недоступен, поэтому browser worker тоже не запускается, а у панели нет
      # сертификата для проверки.
      GATEWAY_BROWSER_WORKER_URL: ""
      GATEWAY_PANEL_TLS_ADDRESS: ""
      GATEWAY_PORT: "443"
      GATEWAY_XRAY_PORT: "443"
    volumes:
      - state:/state

  xray:
    volumes:
      - state:/state

volumes:
  state:
