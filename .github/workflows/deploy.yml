name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push run ID for the current master commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: private-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Select the tested current master release
        id: release
        uses: actions/github-script@v7
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id || github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const runID = process.env.CI_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(runID)) throw new Error('A CI run ID is required');
            const repo = context.repo;
            const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: runID});
            const {data: workflow} = await github.rest.actions.getWorkflow({...repo, workflow_id: 'ci.yml'});
            const {data: master} = await github.rest.repos.getBranch({...repo, branch: 'master'});
            if (run.workflow_id !== workflow.id || run.status !== 'completed' || run.conclusion !== 'success' ||
                run.event !== 'push' || run.head_branch !== 'master' ||
                run.head_repository?.full_name !== `${repo.owner}/${repo.repo}` ||
                !/^[0-9a-f]{40}$/.test(run.head_sha) || run.head_sha !== master.commit.sha) {
              throw new Error('Deployment requires a successful CI push run for the current master commit');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...repo, run_id: runID, per_page: 100});
            const matches = artifacts.filter(a => a.name === 'private-gateway-linux-amd64' && !a.expired);
            if (matches.length !== 1) throw new Error('Exactly one non-expired release artifact is required');
            if (matches[0].size_in_bytes > 272 * 1024 * 1024) throw new Error('Artifact is too large');
            const {data} = await github.rest.actions.downloadArtifact(
              {...repo, artifact_id: matches[0].id, archive_format: 'zip'});
            const content = Buffer.from(data);
            if (content.length > 272 * 1024 * 1024) throw new Error('Artifact download is too large');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'release-artifact.zip'), content, {flag: 'wx', mode: 0o600});
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Verify archive identity, paths and checksums
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: >-
          python3 scripts/verify-release.py "$RUNNER_TEMP/release-artifact.zip"
          --version "$RELEASE_SHA" --arch amd64 --output "$RUNNER_TEMP/verified-release"
      - name: Recheck master before deployment
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch: 'master'});
            if (data.commit.sha !== process.env.RELEASE_SHA) {
              throw new Error('Master changed while preparing deployment; deploy the newer successful CI run');
            }
      - name: Send release to the restricted deployment account
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || { echo 'Set a valid DEPLOY_HOST'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*\$?$ ]] || { echo 'Set a valid DEPLOY_USER'; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Set DEPLOY_PORT to the SSH port'; exit 1; }
          (( 10#$DEPLOY_PORT > 0 && 10#$DEPLOY_PORT <= 65535 )) || exit 1
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo 'SSH key and verified known_hosts are required'; exit 1; }
          umask 077
          credentials=$(mktemp -d "$RUNNER_TEMP/deploy-ssh.XXXXXX")
          trap 'rm -rf "$credentials"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$credentials/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$credentials/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh -F /dev/null -T -p "$DEPLOY_PORT" -i "$credentials/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$credentials/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o ClearAllForwardings=yes -o LogLevel=ERROR \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy < "$RUNNER_TEMP/verified-release/release.tar.gz"
