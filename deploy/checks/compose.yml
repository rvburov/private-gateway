# Одноразовый стек для `bash scripts/dev.sh test`: PostgreSQL 18 в tmpfs и контейнер проверок.
# На хосте ничего не публикуется. scripts/dev.sh называет проект по папке копии, поэтому у
# параллельных рабочих папок отдельные базы, и удаляет проект после прогона.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: gateway_test
      POSTGRES_USER: gateway_test
      POSTGRES_PASSWORD: gateway-checks-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # TCP, а не сокет: во время инициализации образ запускает сервер, доступный только через сокет.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gateway_test -d gateway_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  checks:
    image: ${CHECKS_IMAGE:?Run bash scripts/dev.sh test}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://gateway_test:gateway-checks-only@postgres:5432/gateway_test?sslmode=disable
    volumes:
      - go-build-cache:/home/checks/.cache/go-build

volumes:
  # Общий для всех копий и сохраняется между прогонами; кеш сборки Go безопасен при одновременной работе.
  go-build-cache:
    external: true
    name: private-gateway-checks-go-build
