openapi: 3.1.0
info:
  title: Private Gateway API
  version: 0.1.0
  description: >-
    Один локальный узел Xray. Изменения устройств ждут применения через config/apply.
    Профили содержат секреты: их нельзя кешировать, журналировать и передавать.
    Публичный доступ по Bearer требует временного сеанса после проверки пароля и
    подтверждения аутентификатора. Пока администратор не настроен, публичного доступа
    нет. Долгоживущий токен CLI принимается только с loopback.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: adminLogin
      security: []
      description: Проверить логин и пароль. Возвращает пятиминутный промежуточный токен для подключения или проверки аутентификатора.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Незавершённый вход; не сохраняйте токен за пределами текущей вкладки.
          content:
            application/json:
              schema:
                type: object
                required: [status, pending]
                properties:
                  status: {type: string, enum: [totp_required, totp_setup_required]}
                  pending: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa/setup:
    post:
      operationId: startAdministratorTOTPSetup
      description: После проверки пароля вернуть временный секрет TOTP и URI для подключения аутентификатора в браузере. Секрет сохраняется в PostgreSQL только после подтверждения кода.
      responses:
        '200':
          description: Данные для подключения аутентификатора; не журналируйте и не кешируйте их.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: {type: string}
                  otpauth_uri: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa/setup/confirm:
    post:
      operationId: confirmAdministratorTOTPSetup
      description: Подтвердить первый шестизначный код, зашифровать секрет в PostgreSQL и выдать сеанс на восемь часов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200':
          description: Временный сеанс Bearer.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa:
    post:
      operationId: verifyAdministratorTOTP
      description: Завершить последующий вход новым кодом аутентификатора. Повторно использованный код отклоняется и после перезапуска API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200':
          description: Временный сеанс Bearer.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: adminLogout
      responses:
        '200': {description: Текущий сеанс отозван}
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: Процесс работает}
  /readyz:
    get:
      operationId: ready
      security: []
      responses:
        '200': {description: PostgreSQL доступна}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/status:
    get:
      operationId: status
      responses:
        '200':
          description: Состояние базы и версий конфигурации
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes:
    get:
      operationId: listNodes
      responses:
        '200':
          description: Открытые параметры подключения локального узла
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: {$ref: '#/components/schemas/Node'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices:
    get:
      operationId: listDevices
      responses:
        '200':
          description: Устройства, в том числе отозванные, без секретов
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: {$ref: '#/components/schemas/Device'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Буквы, цифры, пробелы, точки, подчёркивания и дефисы; начинается с буквы или цифры
                node_id:
                  type: string
                  format: uuid
                  default: 00000000-0000-4000-8000-000000000001
      responses:
        '201': {$ref: '#/components/responses/Device'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
    delete:
      operationId: deleteRevokedDevice
      description: >-
        Окончательно удалить отозванное устройство после того, как конфигурация Xray
        применила его отзыв. Неизменяемая история аудита сохраняет UUID устройства.
      responses:
        '200':
          description: Устройство удалено
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [deleted]}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}/profile:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
    get:
      operationId: exportDevice
      responses:
        '200':
          description: Секретная ссылка VLESS и конфигурации клиентов sing-box и Mihomo, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [uri, sing_box_json, mihomo_yaml, subscription_path]
                properties:
                  uri: {type: string, format: uri}
                  sing_box_json: {type: string, description: Полная конфигурация sing-box в JSON}
                  mihomo_yaml: {type: string, description: Полная конфигурация Mihomo в YAML}
                  subscription_path: {type: string, description: '/sub/ и секретный токен ссылки-подписки устройства на домене панели'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}/subscription:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
    post:
      operationId: rotateSubscription
      description: Выдать активному устройству новую ссылку-подписку. Прежняя ссылка сразу перестаёт работать.
      responses:
        '200':
          description: Путь новой ссылки, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [subscription_path]
                properties:
                  subscription_path: {type: string}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/traffic:
    get:
      operationId: deviceTraffic
      responses:
        '200':
          description: Байты каждого активного устройства с последнего перезапуска Xray, по ID устройства
          content:
            application/json:
              schema:
                type: object
                required: [devices, period]
                properties:
                  devices:
                    type: object
                    additionalProperties:
                      type: object
                      required: [uplink_bytes, downlink_bytes]
                      properties:
                        uplink_bytes: {type: integer, minimum: 0}
                        downlink_bytes: {type: integer, minimum: 0}
                  period: {type: string, enum: [since_xray_restart]}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /sub/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
      - {name: format, in: query, required: false, schema: {type: string, enum: [base64, uri, sing-box, mihomo, html]}}
    get:
      operationId: subscription
      security: []
      description: >-
        Открытая ссылка-подписка активного устройства: секрет — токен в пути. Без format
        формат выбирает User-Agent клиента; браузер получает HTML-страницу. Отозванные
        устройства и заменённые ссылки отвечают 404. Чтения не журналируются и не попадают
        в аудит.
      responses:
        '200': {description: Профиль устройства в запрошенном формате}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
    post:
      operationId: revokeDevice
      description: Повторный вызов безопасен. Сетевой доступ прекращается после успешного config/apply.
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/audit:
    get:
      operationId: listAudit
      responses:
        '200':
          description: Последние 100 неизменяемых событий аудита без секретов
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/checks:
    get:
      operationId: serverChecks
      description: >-
        Серверные проверки для панели: PostgreSQL, применённая версия конфигурации, работающий
        процесс Xray, сайт маскировки REALITY по TLS 1.3, сертификат панели и настоящий
        VLESS-запрос через Xray с профилем самого старого активного устройства. Занимает до
        20 секунд; одновременно идёт только одна проверка.
      responses:
        '200':
          description: Результаты в постоянном порядке, без секретов
          content:
            application/json:
              schema:
                type: object
                required: [checks]
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, detail]
                      properties:
                        id: {type: string, enum: [database, configuration, xray, reality, certificate, traffic]}
                        title: {type: string}
                        status: {type: string, enum: [ok, warn, fail, skip]}
                        detail: {type: string}
                        ip: {type: string, description: 'только у traffic: адрес, который видят сайты за шлюзом'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/validate:
    post:
      operationId: validateConfig
      description: Собрать конфигурацию из текущих активных устройств и проверить её заданным бинарником Xray.
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/apply:
    post:
      operationId: applyConfig
      description: Проверить и атомарно записать конфигурацию, выполнить заданную команду перезапуска, при сбое откатить, затем записать применённую ревизию.
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/browser:
    get:
      operationId: browserStatus
      description: Возвращает состояние браузера и ставит cookie Secure и HttpOnly на /browser для подтверждённого сеанса администратора. Caddy проверяет этот cookie, прежде чем пропустить к noVNC.
      responses:
        '200': {$ref: '#/components/responses/Browser'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/browser/start:
    post:
      operationId: startBrowser
      responses:
        '200': {$ref: '#/components/responses/Browser'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/browser/stop:
    post:
      operationId: stopBrowser
      description: Удалить временный сеанс браузера вместе с cookies.
      responses:
        '200': {$ref: '#/components/responses/Browser'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/metrics:
    get:
      operationId: metrics
      responses:
        '200':
          description: Метрики Prometheus, нужна авторизация Bearer
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Error:
      description: Нет доступа, неверные данные, служба недоступна или операция не удалась
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
    Device:
      description: Запись устройства без секрета
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Device'}
    Operation:
      description: Конфигурация проверена или применена
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: {type: string, enum: [valid, applied]}
    Browser:
      description: Готовность браузера в закрытом Docker worker
      content:
        application/json:
          schema:
            type: object
            required: [running]
            properties:
              running: {type: boolean}
              url: {type: string, format: uri, description: Адрес noVNC по HTTPS под защитой cookie подтверждённого сеанса администратора}
  schemas:
    Node:
      type: object
      required: [id, name, host, port, server_name, public_key, short_id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        server_name: {type: string}
        public_key: {type: string}
        short_id: {type: string}
    Device:
      type: object
      required: [id, node_id, name, created_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    AuditEvent:
      type: object
      required: [id, action, device_id, created_at]
      properties:
        id: {type: integer, format: int64}
        action: {type: string}
        device_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    Status:
      type: object
      required: [database, node_id, devices, active_devices, desired_revision, applied_revision, xray_configured]
      properties:
        database: {type: string, enum: [ok]}
        node_id: {type: string, format: uuid}
        devices: {type: integer, minimum: 0}
        active_devices: {type: integer, minimum: 0}
        desired_revision: {type: integer, minimum: 1}
        applied_revision: {type: integer, minimum: 0}
        xray_configured: {type: boolean, description: 'Команда перезапуска задана; это не значит, что процесс Xray работает'}
