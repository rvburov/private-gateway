name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_test -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://gateway_test:gateway-ci-only@127.0.0.1:5432/gateway_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install verified Xray
        run: bash scripts/install-xray.sh "$RUNNER_TEMP/xray"
      - name: Test Go and PostgreSQL integration
        env:
          PRIVATE_GATEWAY_REAL_XRAY_BINARY: ${{ runner.temp }}/xray/xray
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/...
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Test web interactions
        working-directory: web
        run: npm test
