name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

# Все задания идут на Ubuntu 26.04 — той же версии, что на серверах.
jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Та же команда, что на компьютере разработчика: все проверки в Docker-образе deploy/checks,
      # с PostgreSQL 18 и настоящим Xray; пропущенный интеграционный тест проваливает её.
      - name: Run all checks in Docker
        run: bash scripts/dev.sh test
      # Проверки релиза, образов и установки идут для каждой отправленной ветки, чтобы ветку можно
      # было проверить на GitHub до master. Загружает релиз и выкладывает только master.
      - name: Build production release
        if: github.event_name == 'push'
        run: bash scripts/dev.sh release "$RUNNER_TEMP/release"
      - name: Build and validate Docker images
        if: github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/docker-payload"
          tar -xzf "$RUNNER_TEMP/release/release.tar.gz" -C "$RUNNER_TEMP/docker-payload"
          for service in api xray browser; do
            docker build -f "$RUNNER_TEMP/docker-payload/docker/Dockerfile.$service" \
              -t "private-gateway/$service:ci" "$RUNNER_TEMP/docker-payload"
          done
          docker run --rm --entrypoint python3 private-gateway/api:ci -c \
            'from pathlib import Path; root = Path("/app/web"); assert b"<div id=\"root\"></div>" in (root / "index.html").read_bytes(); assets = list((root / "assets").iterdir()); assert assets; [asset.read_bytes() for asset in assets]'
          python3 - "$RUNNER_TEMP/docker-payload/docker/Caddyfile.template" \
            "$RUNNER_TEMP/Caddyfile" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          text = text.replace('__PANEL_DOMAIN__', 'example.com')
          assert '__' not in text
          Path(sys.argv[2]).write_text(text)
          PY
          caddy_image=$(sed -n 's/^ *image: \(caddy:[^ ]*\)$/\1/p' deploy/docker/compose.yml)
          docker run --rm --cap-drop=ALL --cap-add=NET_BIND_SERVICE \
            --security-opt=no-new-privileges \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy "$caddy_image" validate --config /etc/caddy/Caddyfile
          python3 scripts/test-browser-proxy.py
          python3 scripts/test-edge-router.py
          bash scripts/test-first-deploy.sh "$RUNNER_TEMP/release/release.tar.gz" private-gateway/api:ci
      - name: Validate Docker Compose configuration
        if: github.event_name == 'push'
        run: |
          cat > "$RUNNER_TEMP/docker-test.env" <<'EOF'
          PG_RELEASE_SHA=0000000000000000000000000000000000000000
          POSTGRES_PASSWORD=dummy-password
          GATEWAY_API_TOKEN=dummy-api-token
          GATEWAY_MASTER_KEY=dummy-master-key
          GATEWAY_REALITY_PRIVATE_KEY=dummy-private-key
          GATEWAY_SHORT_ID=0123456789abcdef
          BROWSER_WORKER_TOKEN=dummy-browser-token
          GATEWAY_HOST=127.0.0.1
          PANEL_DOMAIN=example.com
          GATEWAY_STATE_DIR=/tmp/private-gateway-ci-xray
          GATEWAY_CADDYFILE=/tmp/private-gateway-ci-Caddyfile
          EOF
          docker compose --env-file "$RUNNER_TEMP/docker-test.env" \
            -f deploy/docker/compose.yml config --quiet
          python3 scripts/verify-release.py --tar "$RUNNER_TEMP/release/release.tar.gz"
      # Настоящие первичная установка, установщик и обновление на этом runner, как на новом VPS:
      # первая выкладка, обновление одной панели, которое должно пересоздать только API, и два
      # обновления, которые ломают панель и VLESS-трафик и должны откатиться. Порты 80, 443 и
      # 8443 остаются занятыми.
      - name: Test installation, update and rollback
        if: github.event_name == 'push'
        run: bash scripts/test-install-update.sh "$RUNNER_TEMP/release/release.tar.gz"
      - name: Upload production release and installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-gateway-linux-amd64
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30

  servers:
    name: Server list
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read deploy/servers
        id: list
        run: python3 scripts/servers.py list >> "$GITHUB_OUTPUT"

  # Каждый сервер из deploy/servers получает проверенный релиз этого коммита. Сбой одного сервера
  # не останавливает остальные; у каждого своя очередь, поэтому два push не выкладываются на него
  # одновременно.
  deploy:
    name: Deploy Docker to VPS (${{ matrix.server }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.servers.outputs.names != '[]'
    needs: [verify, servers]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.servers.outputs.names) }}
    concurrency:
      group: private-gateway-deploy-${{ matrix.server }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: private-gateway-linux-amd64
          path: ${{ runner.temp }}/release
      - name: Verify the successful CI release
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check release.tar.gz.sha256
          version=$(python3 "$GITHUB_WORKSPACE/scripts/verify-release.py" --tar release.tar.gz)
          test "$version" = "$GITHUB_SHA"
      - name: Read the server record
        id: server
        env:
          SERVER: ${{ matrix.server }}
        run: python3 scripts/servers.py show "$SERVER" >> "$GITHUB_OUTPUT"
      - name: Read the release public ports
        id: ports
        env:
          PG_RELEASE_SHA: ${{ github.sha }}
          POSTGRES_PASSWORD: unused-for-config
          GATEWAY_API_TOKEN: unused-for-config
          GATEWAY_MASTER_KEY: unused-for-config
          GATEWAY_REALITY_PRIVATE_KEY: unused-for-config
          GATEWAY_SHORT_ID: "0123456789abcdef"
          BROWSER_WORKER_TOKEN: unused-for-config
          GATEWAY_HOST: ${{ steps.server.outputs.host }}
          PANEL_DOMAIN: ${{ steps.server.outputs.domain }}
          GATEWAY_STATE_DIR: /tmp/private-gateway-port-check
          GATEWAY_CADDYFILE: /tmp/private-gateway-port-check-Caddyfile
        run: |
          mkdir -p "$RUNNER_TEMP/deployed-release"
          tar -xzf "$RUNNER_TEMP/release/release.tar.gz" -C "$RUNNER_TEMP/deployed-release"
          docker compose -f "$RUNNER_TEMP/deployed-release/docker/compose.yml" config --format json \
            | python3 "$RUNNER_TEMP/deployed-release/docker/release-ports.py" > "$RUNNER_TEMP/release-ports.json"
          python3 - "$RUNNER_TEMP/release-ports.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          ports = json.load(open(sys.argv[1]))
          print(f'panel={ports["panel"]}')
          print(f'vpn={ports["vpn"]}')
          PY
      - name: Deploy the current master commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ steps.server.outputs.host }}
          DEPLOY_PORT: ${{ steps.server.outputs.port }}
          DEPLOY_USER: ${{ steps.server.outputs.user }}
          DEPLOY_KNOWN_HOSTS: ${{ steps.server.outputs.known_hosts }}
          PANEL_PORT: ${{ steps.ports.outputs.panel }}
          VPN_PORT: ${{ steps.ports.outputs.vpn }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY in repository secrets}"
          latest=$(git ls-remote origin refs/heads/master | cut -f1)
          if [[ $latest != "$GITHUB_SHA" ]]; then
            echo 'A newer master commit exists; this release is superseded.'
            exit 0
          fi
          install -d -m 0700 "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/deploy-ssh/id_ed25519" "$RUNNER_TEMP/deploy-ssh/known_hosts"
          { printf '%s\n' "$GITHUB_SHA"; cat "$RUNNER_TEMP/release/release.tar.gz"; } | \
            ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
              -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST"
          # Повторная доставка не меняет стек. Она исполняет уже установленный updater и
          # доказывает, что подготовительный выпуск действительно заменил старый скрипт.
          receipt=$({ printf '%s\n' "$GITHUB_SHA"; cat "$RUNNER_TEMP/release/release.tar.gz"; } | \
            ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
              -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST")
          printf '%s\n' "$receipt"
          grep -Fx "Installed release verified: $GITHUB_SHA; panel=$PANEL_PORT; vpn=$VPN_PORT; updater=current" <<< "$receipt"
      # Снаружи, с полной проверкой TLS: должны ответить DNS, HAProxy, Caddy и API. Новому серверу
      # нужно несколько минут на первый сертификат. VLESS этим не проверяется.
      - name: Check the panel from the internet
        env:
          DOMAIN: ${{ steps.server.outputs.domain }}
          PANEL_PORT: ${{ steps.ports.outputs.panel }}
        run: |
          for _ in $(seq 1 36); do
            if curl --fail --silent --max-time 10 --output /dev/null "https://$DOMAIN:$PANEL_PORT/readyz"; then
              echo "Panel https://$DOMAIN:$PANEL_PORT/ is ready with a trusted certificate."
              exit 0
            fi
            sleep 5
          done
          curl --fail --show-error --max-time 10 --output /dev/null "https://$DOMAIN:$PANEL_PORT/readyz"
