openapi: 3.1.0
info:
  title: Private Gateway API
  version: 0.1.0
  description: >-
    Один локальный узел Xray. Изменения устройств ждут применения через config/apply.
    Профили содержат секреты: их нельзя кешировать, журналировать и передавать.
    Публичный доступ по Bearer требует временного сеанса после проверки пароля и
    подтверждения аутентификатора. Пока администратор не настроен, публичного доступа
    нет. Долгоживущий токен CLI принимается только с loopback.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: adminLogin
      security: []
      description: Проверить логин и пароль. Возвращает пятиминутный промежуточный токен для подключения или проверки аутентификатора.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: Незавершённый вход; не сохраняйте токен за пределами текущей вкладки.
          content:
            application/json:
              schema:
                type: object
                required: [status, pending]
                properties:
                  status: {type: string, enum: [totp_required, totp_setup_required]}
                  pending: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/auth/restore:
    get:
      operationId: restoreAdministratorSession
      security: []
      description: По действующей HttpOnly cookie сохранённого входа выдать новый восьмичасовой сеанс. Без cookie возвращает 401.
      responses:
        '200':
          description: Новый временный сеанс Bearer.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa/setup:
    post:
      operationId: startAdministratorTOTPSetup
      description: После проверки пароля вернуть временный секрет TOTP и URI для подключения аутентификатора в браузере. Секрет сохраняется в PostgreSQL только после подтверждения кода.
      responses:
        '200':
          description: Данные для подключения аутентификатора; не журналируйте и не кешируйте их.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri]
                properties:
                  secret: {type: string}
                  otpauth_uri: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa/setup/confirm:
    post:
      operationId: confirmAdministratorTOTPSetup
      description: Подтвердить первый шестизначный код, зашифровать секрет в PostgreSQL и выдать сеанс на восемь часов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{6}$'}
                remember: {type: boolean, default: false, description: Запомнить вход в этом браузере на 30 дней}
      responses:
        '200':
          description: Временный сеанс Bearer.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/2fa:
    post:
      operationId: verifyAdministratorTOTP
      description: Завершить последующий вход новым кодом аутентификатора. Повторно использованный код отклоняется и после перезапуска API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, pattern: '^[0-9]{6}$'}
                remember: {type: boolean, default: false, description: Запомнить вход в этом браузере на 30 дней}
      responses:
        '200':
          description: Временный сеанс Bearer.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: {type: string}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      operationId: adminLogout
      description: Отозвать текущий сеанс, сохранённый вход и связанные push-подписки. Отпечаток текущей подписки браузера помогает отозвать и прежнюю подписку после перезапуска API или нового входа.
      parameters:
        - name: X-Gateway-Push-Hash
          in: header
          required: false
          description: Первые 8 байт SHA-256 endpoint текущей push-подписки в hex. Это необязательный несекретный отпечаток, а не адрес доставки или токен доступа; авторизация Bearer по-прежнему обязательна.
          schema: {type: string, pattern: '^[0-9a-f]{16}$'}
      responses:
        '200': {description: Текущий сеанс и сохранённый вход этого браузера отозваны}
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: Процесс работает}
  /readyz:
    get:
      operationId: ready
      security: []
      responses:
        '200': {description: PostgreSQL доступна}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/status:
    get:
      operationId: status
      responses:
        '200':
          description: Состояние базы и версий конфигурации
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/nodes:
    get:
      operationId: listNodes
      responses:
        '200':
          description: Открытые параметры подключения локального узла
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: {$ref: '#/components/schemas/Node'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices:
    get:
      operationId: listDevices
      responses:
        '200':
          description: Устройства, в том числе отозванные, без секретов
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: {$ref: '#/components/schemas/Device'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Буквы, цифры, пробелы, точки, подчёркивания и дефисы; начинается с буквы или цифры
                node_id:
                  type: string
                  format: uuid
                  default: 00000000-0000-4000-8000-000000000001
      responses:
        '201': {$ref: '#/components/responses/Device'}
        '400': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
    delete:
      operationId: deleteRevokedDevice
      description: >-
        Окончательно удалить отозванное устройство после того, как конфигурация Xray
        применила его отзыв. Неизменяемая история аудита сохраняет UUID устройства.
      responses:
        '200':
          description: Устройство удалено
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [deleted]}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}/profile:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/ProfilePort'}
    get:
      operationId: exportDevice
      responses:
        '200':
          description: Секретная ссылка VLESS и конфигурации клиентов sing-box и Mihomo, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [port, uri, sing_box_json, mihomo_yaml, subscription_path]
                properties:
                  port: {type: integer, minimum: 1, maximum: 65535, description: Внешний порт существующего TCP/Vision-профиля и панели; в production 8443}
                  uri: {type: string, format: uri, description: Существующий профиль VLESS + TCP + REALITY + Vision}
                  xhttp_uri: {type: string, format: uri, description: Необязательный профиль VLESS + XHTTP + REALITY без Vision; доступен при включённом входе XHTTP}
                  xhttp_port: {type: integer, minimum: 1, maximum: 65535, description: Внешний порт необязательного входа XHTTP}
                  sing_box_json: {type: string, description: Полная конфигурация sing-box в JSON}
                  mihomo_yaml: {type: string, description: Полная конфигурация Mihomo в YAML}
                  subscription_path: {type: string, description: '/sub/ и секретный токен ссылки-подписки; HTTPS-адрес панели в production содержит :8443'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}/subscription:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
      - {$ref: '#/components/parameters/ProfilePort'}
    post:
      operationId: rotateSubscription
      description: Выдать активному устройству новую ссылку-подписку. Прежняя ссылка сразу перестаёт работать.
      responses:
        '200':
          description: Путь новой ссылки, Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [subscription_path]
                properties:
                  subscription_path: {type: string}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/devices/traffic:
    get:
      operationId: deviceTraffic
      responses:
        '200':
          description: Байты каждого активного устройства с последнего перезапуска Xray, по ID устройства
          content:
            application/json:
              schema:
                type: object
                required: [devices, period]
                properties:
                  devices:
                    type: object
                    additionalProperties:
                      type: object
                      required: [uplink_bytes, downlink_bytes]
                      properties:
                        uplink_bytes: {type: integer, minimum: 0}
                        downlink_bytes: {type: integer, minimum: 0}
                  period: {type: string, enum: [since_xray_restart]}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /sub/{token}:
    parameters:
      - {name: token, in: path, required: true, schema: {type: string}}
      - {name: format, in: query, required: false, schema: {type: string, enum: [base64, uri, sing-box, mihomo, html]}}
      - {$ref: '#/components/parameters/ProfilePort'}
    get:
      operationId: subscription
      security: []
      description: >-
        Открытая ссылка-подписка активного устройства: секрет — токен в пути. Без format
        формат выбирает User-Agent клиента; браузер получает HTML-страницу. Отозванные
        устройства и заменённые ссылки отвечают 404. Чтения не журналируются и не попадают
        в аудит. При включённом и успешно применённом XHTTP общий список base64 содержит сначала XHTTP, затем
        TCP/Vision. Известные legacy-клиенты Hiddify, sing-box, Clash/Mihomo и Stash
        продолжают получать совместимый TCP-профиль. Форматы uri, sing-box и mihomo
        сохраняют прежнее содержимое. Каноническая ссылка и токен устройства не меняются.
      responses:
        '200': {description: Профиль устройства в запрошенном формате}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/devices/{id}/revoke:
    parameters:
      - {$ref: '#/components/parameters/DeviceID'}
    post:
      operationId: revokeDevice
      description: Повторный вызов безопасен. Сетевой доступ прекращается после успешного config/apply.
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/audit:
    get:
      operationId: listAudit
      responses:
        '200':
          description: Последние 100 неизменяемых событий аудита без секретов
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/checks:
    get:
      operationId: serverChecks
      description: >-
        Серверные проверки для панели: PostgreSQL, применённая версия конфигурации, работающий
        процесс Xray, сайт маскировки REALITY по TLS 1.3, сертификат панели и настоящий
        VLESS-запрос через Xray с профилем самого старого активного устройства. Занимает до
        20 секунд; одновременно идёт только одна проверка.
      responses:
        '200':
          description: Результаты в постоянном порядке, без секретов
          content:
            application/json:
              schema:
                type: object
                required: [checks]
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, detail]
                      properties:
                        id: {type: string, enum: [database, configuration, xray, reality, certificate, traffic]}
                        title: {type: string}
                        status: {type: string, enum: [ok, warn, fail, skip]}
                        detail: {type: string}
                        ip: {type: string, description: 'только у traffic: адрес, который видят сайты за шлюзом'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/checks/performance/ping:
    get:
      operationId: performancePing
      description: Короткий авторизованный ответ без кеширования для HTTP-проб браузера. Не является ICMP ping.
      responses:
        '200':
          description: Сервер принял пробу.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean, const: true}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/checks/performance/download:
    get:
      operationId: performanceDownload
      description: >-
        Случайные несжимаемые данные без кеширования для замера канала до панели.
        Одна передача одновременно, общий бюджет 64 МиБ в минуту, дедлайн 10 секунд.
        Доступность и скорость панели не подтверждают скорость VLESS с устройства.
      parameters:
        - name: bytes
          in: query
          description: Число байтов; параметр допускается только один раз.
          schema: {type: integer, minimum: 1, maximum: 4194304, default: 4194304}
      responses:
        '200':
          description: Запрошенное число байтов, Content-Encoding identity и Cache-Control no-store.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '429':
          description: Общий бюджет исчерпан; Retry-After содержит число секунд до следующего окна.
        default: {$ref: '#/components/responses/Error'}
  /api/v1/checks/performance/upload:
    post:
      operationId: performanceUpload
      description: >-
        Принимает и отбрасывает несжатое тело до 1 МиБ без сохранения или журналирования.
        Ограничения передачи и бюджета общие с download. Дедлайн 10 секунд.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary, maxLength: 1048576}
      responses:
        '200':
          description: Фактически принятое число байтов.
          content:
            application/json:
              schema:
                type: object
                required: [bytes]
                properties:
                  bytes: {type: integer, minimum: 0, maximum: 1048576}
        '400': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '429':
          description: Общий бюджет исчерпан; Retry-After содержит число секунд до следующего окна.
        default: {$ref: '#/components/responses/Error'}
  /api/v1/checks/performance/server:
    get:
      operationId: performanceServer
      description: >-
        Снимок доступных показателей без профилей, ключей и переменных окружения.
        Поля system относятся к системе или VM, видимой через proc, api — к cgroup API,
        vpn — к отдельному свежему снимку worker Xray. Недоступные значения равны null.
        Счётчики накопительные: изменение вычисляется по двум снимкам с проверкой сброса.
      responses:
        '200':
          description: Снимок ресурсов без кеширования; недоступность отдельного показателя не заменяется нулём.
          content:
            application/json:
              schema:
                type: object
                required: [sampledAt, runtime, system, api, vpn]
                properties:
                  sampledAt: {type: string, format: date-time}
                  runtime:
                    type: object
                    properties:
                      os: {type: string}
                      arch: {type: string}
                      goVersion: {type: string}
                      cpuCount: {type: integer}
                      goroutines: {type: integer}
                      version: {type: string}
                      revision: {type: string}
                  system:
                    type: object
                    properties:
                      scope: {type: string}
                      uptimeSeconds: {type: [number, 'null']}
                      loadAverage:
                        type: [array, 'null']
                        items: {type: number}
                      memoryTotalBytes: {type: [integer, 'null']}
                      memoryAvailableBytes: {type: [integer, 'null']}
                      cpu:
                        type: [object, 'null']
                        properties:
                          totalTicks: {type: integer}
                          stealTicks: {type: integer}
                  api: {$ref: '#/components/schemas/ResourceDiagnostics'}
                  vpn:
                    type: object
                    properties:
                      status: {type: string, enum: [ok, unavailable, stale, invalid]}
                      detail: {type: string}
                      scope: {type: string}
                      sampledAt: {type: string, format: date-time}
                      running: {type: [boolean, 'null']}
                      cgroup: {$ref: '#/components/schemas/ResourceDiagnostics'}
                      network:
                        type: [object, 'null']
                        properties:
                          rxBytes: {type: integer}
                          txBytes: {type: integer}
                      tcp:
                        type: [object, 'null']
                        properties:
                          outSegments: {type: integer}
                          retransmittedSegments: {type: integer}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/validate:
    post:
      operationId: validateConfig
      description: Собрать конфигурацию из текущих активных устройств и проверить её заданным бинарником Xray.
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/config/apply:
    post:
      operationId: applyConfig
      description: Проверить и атомарно записать конфигурацию, выполнить заданную команду перезапуска, при сбое откатить, затем записать применённую ревизию.
      responses:
        '200': {$ref: '#/components/responses/Operation'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/browser:
    get:
      operationId: browserStatus
      description: Возвращает состояние браузера и ставит cookie Secure и HttpOnly на /browser для подтверждённого сеанса администратора. Caddy проверяет этот cookie, прежде чем пропустить к noVNC.
      responses:
        '200': {$ref: '#/components/responses/Browser'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/browser/start:
    post:
      operationId: startBrowser
      responses:
        '200': {$ref: '#/components/responses/Browser'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/browser/stop:
    post:
      operationId: stopBrowser
      description: Удалить временный сеанс браузера вместе с cookies.
      responses:
        '200': {$ref: '#/components/responses/Browser'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/metrics:
    get:
      operationId: metrics
      responses:
        '200':
          description: Метрики Prometheus, нужна авторизация Bearer
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notifications:
    get:
      operationId: listNotifications
      description: Общий центр администратора; до 200 последних сообщений за 30 дней, сначала новые. Число непрочитанных относится к возвращённым сообщениям.
      responses:
        '200':
          description: Сообщения и счётчик непрочитанных.
          content:
            application/json:
              schema:
                type: object
                required: [items, unread]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: {$ref: '#/components/schemas/Notification'}
                  unread: {type: integer, minimum: 0, maximum: 200}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/read:
    post:
      operationId: readNotifications
      description: Отметить выбранные сообщения прочитанными. Отсутствующее поле ids, ids со значением null или пустой список означает все сообщения. Неизвестные корректные UUID игнорируются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids:
                  type: [array, 'null']
                  maxItems: 200
                  items: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/NotificationSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/preferences:
    get:
      operationId: notificationPreferences
      description: Общие настройки категорий центра и push на всех устройствах. По умолчанию все три категории включены.
      responses:
        '200':
          description: Настройки категорий.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferences'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    put:
      operationId: saveNotificationPreferences
      description: Заменить все три настройки. Выключенная категория не создаёт новых сообщений в центре и push; существующие сообщения сохраняются.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPreferences'}
      responses:
        '200':
          description: Сохранённые настройки.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPreferences'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/push-key:
    get:
      operationId: notificationPushKey
      description: Публичный ключ VAPID для подписки браузера. Пара ключей создаётся автоматически и хранится зашифрованной в базе; закрытый ключ не возвращается.
      responses:
        '200':
          description: Ключ в base64url.
          content:
            application/json:
              schema:
                type: object
                required: [public_key]
                properties:
                  public_key: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/push-subscriptions:
    get:
      operationId: listNotificationPushSubscriptions
      description: До 16 действующих подписок текущего поколения администратора. Возвращается короткий отпечаток адреса доставки, сам адрес и ключи браузера не раскрываются.
      responses:
        '200':
          description: Браузеры с действующей подпиской.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 16
                    items: {$ref: '#/components/schemas/NotificationPushDevice'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
    post:
      operationId: subscribeNotificationPush
      description: >-
        Создать или обновить подписку по адресу доставки. Нужны HTTPS endpoint
        доверенного браузерного push-сервиса, валидный ключ P-256 и 16-байтный auth.
        Подписка привязывается к хешу текущего входа, поколению администратора и сроку
        входа: до 8 часов или оставшегося срока сохранённого входа до 30 дней.
        Выход и смена учётных данных отзывают соответствующий доступ. Адрес и ключи
        доставки сохраняются зашифрованными. При превышении 16 подписок удаляются
        самые старые. Подписка сама по себе не запрашивает разрешение браузера.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationPushSubscription'}
      responses:
        '200':
          description: Метаданные сохранённой подписки.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationPushDevice'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/push-subscriptions/{id}:
    delete:
      operationId: revokeNotificationPushSubscription
      description: Администратор отзывает любую подписку по UUID. Повторный отзыв неизвестного корректного UUID также успешен; браузерный unsubscribe выполняется отдельно.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/NotificationSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/notifications/test:
    post:
      operationId: testNotificationPush
      description: >-
        Отправить тест на выбранную действующую подписку, не чаще раза в минуту
        на подписку. Успешный ответ подтверждает приём сервисом доставки, а не
        показ уведомления на устройстве. Ответ сервиса 404 или 410 удаляет
        недействующую подписку. Тест не добавляет сообщение в центр.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subscription_id]
              properties:
                subscription_id: {type: string, format: uuid}
      responses:
        '200': {$ref: '#/components/responses/NotificationSuccess'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/ip-lookup:
    post:
      operationId: lookupPublicIP
      description: >-
        Получить сведения о явно переданном публичном IPv4 или IPv6 через серверный
        IP2Location.io. Не определяет адрес вызывающего браузера или сервера сам по себе.
        Ключ берётся только из GATEWAY_IP2LOCATION_API_KEY на сервере; без него внешний
        запрос не выполняется. Все штатные результаты, включая недоступность и лимит,
        возвращаются с HTTP 200 и явным status. Внешний запрос ограничен 6 секундами,
        ответ — 128 КиБ, редиректы запрещены. Общие счётчики процесса API: 12 запросов
        в минутном окне, 200 в 24-часовом окне, не более двух запросов одновременно;
        перезапуск сбрасывает счётчики. История IP и кеш ответов на сервере не ведутся.
        Условия тарифа, стоимость и набор полей определяет провайдер.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ip]
              properties:
                ip:
                  type: string
                  description: Публичный IP без URL, порта, zone или имени сайта. Частные, loopback, link-local, служебные и документационные сети отклоняются; IPv4-mapped IPv6 нормализуется в IPv4.
                  anyOf:
                    - {format: ipv4}
                    - {format: ipv6}
      responses:
        '200':
          description: Статус источника и разрешённые сведения; отсутствие данных не означает отрицательный признак прокси.
          headers:
            Retry-After:
              description: При локальном status=rate_limited — число секунд до повторной попытки. Ограничение провайдера может не содержать этого заголовка.
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IPLookupResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    ProfilePort:
      name: port
      in: query
      required: false
      description: >-
        Устаревший параметр совместимости. Значения primary и 8443 принимаются, но
        оба выдают текущий основной профиль узла (в production 8443), как запрос без
        параметра. Он больше не выбирает альтернативный порт. Пустое значение, 443,
        произвольное значение или повтор параметра дают 400 до выдачи или замены
        ссылки. Действительные старые ссылки на HTTPS :8443 сохраняются. Новые пути
        подписки не содержат выбора порта; адрес загрузки в production — HTTPS :8443.
      schema: {type: string, enum: [primary, '8443']}
    DeviceID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    NotificationSuccess:
      description: Операция выполнена.
      content:
        application/json:
          schema:
            type: object
            required: [ok]
            properties:
              ok: {type: boolean, const: true}
    Error:
      description: Нет доступа, неверные данные, служба недоступна или операция не удалась
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
    Device:
      description: Запись устройства без секрета
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Device'}
    Operation:
      description: Конфигурация проверена или применена
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: {type: string, enum: [valid, applied]}
    Browser:
      description: Готовность браузера в закрытом Docker worker
      content:
        application/json:
          schema:
            type: object
            required: [running]
            properties:
              running: {type: boolean}
              url: {type: string, format: uri, description: Адрес noVNC по HTTPS под защитой cookie подтверждённого сеанса администратора}
  schemas:
    IPLookupResult:
      type: object
      additionalProperties: false
      required: [ip, source, status, checkedAt, detail, data]
      properties:
        ip: {type: string, description: 'Нормализованный IP из запроса, а не адрес вызывающего клиента.'}
        source: {type: string, const: IP2Location.io}
        status: {type: string, enum: [available, partial, not_configured, unavailable, rate_limited], description: available — полный валидный набор; partial — часть
            полей неизвестна; остальные статусы не содержат данных.}
        checkedAt: {type: [string, 'null'], format: date-time, description: Время получения валидного результата в UTC RFC3339Nano; при отсутствии data — null.}
        detail: {type: string, description: 'Безопасное русское пояснение без ключа, полного URL и исходной ошибки провайдера.'}
        data: {$ref: '#/components/schemas/IPLookupData'}
      allOf:
      - if:
          properties:
            status:
              enum: [available, partial]
        then:
          properties:
            checkedAt: {type: string, format: date-time}
            data: {type: object}
        else:
          properties:
            checkedAt: {type: 'null'}
            data: {type: 'null'}
    IPLookupText: {type: [string, 'null'], maxLength: 2048, description: 'Не более 2048 байт UTF-8. Пропуск, пустая строка, «-», управляющие символы или ключ сервиса
        заменяются на null.'}
    IPLookupFlag: {type: [boolean, 'null'], description: Только исходный JSON boolean. null — неизвестно; false не подставляется вместо отсутствующего поля.}
    IPLookupData:
      type: [object, 'null']
      additionalProperties: false
      required: [ip, country_code, country_name, region_name, district, city_name, latitude, longitude, zip_code, time_zone, asn, as, isp, domain, net_speed, idd_code,
        area_code, weather_station_code, weather_station_name, mcc, mnc, mobile_brand, elevation, usage_type, address_type, ads_category, ads_category_name, as_info,
        continent, country, region, city, time_zone_info, geotargeting, is_proxy, fraud_score, proxy]
      properties:
        ip: {$ref: '#/components/schemas/IPLookupText'}
        country_code: {$ref: '#/components/schemas/IPLookupText'}
        country_name: {$ref: '#/components/schemas/IPLookupText'}
        region_name: {$ref: '#/components/schemas/IPLookupText'}
        district: {$ref: '#/components/schemas/IPLookupText'}
        city_name: {$ref: '#/components/schemas/IPLookupText'}
        latitude: {type: [number, 'null'], minimum: -90, maximum: 90, description: Числовой показатель в указанном диапазоне; числовые строки провайдера нормализуются в JSON number.}
        longitude: {type: [number, 'null'], minimum: -180, maximum: 180, description: Числовой показатель в указанном диапазоне; числовые строки провайдера нормализуются в JSON number.}
        zip_code: {$ref: '#/components/schemas/IPLookupText'}
        time_zone: {$ref: '#/components/schemas/IPLookupText'}
        asn: {type: [integer, string, 'null'], minimum: 0, maximum: 4294967295, description: Число или исходная числовая строка в указанном диапазоне; неизвестное значение
            — null.}
        as: {$ref: '#/components/schemas/IPLookupText'}
        isp: {$ref: '#/components/schemas/IPLookupText'}
        domain: {$ref: '#/components/schemas/IPLookupText'}
        net_speed: {type: [string, 'null'], description: 'Категория соединения в базе, например T1; не измеренная скорость.'}
        idd_code: {$ref: '#/components/schemas/IPLookupText'}
        area_code: {$ref: '#/components/schemas/IPLookupText'}
        weather_station_code: {$ref: '#/components/schemas/IPLookupText'}
        weather_station_name: {$ref: '#/components/schemas/IPLookupText'}
        mcc: {$ref: '#/components/schemas/IPLookupText'}
        mnc: {$ref: '#/components/schemas/IPLookupText'}
        mobile_brand: {$ref: '#/components/schemas/IPLookupText'}
        elevation: {type: [number, 'null'], minimum: -1000, maximum: 100000, description: Высота; числовые строки провайдера нормализуются в JSON number.}
        usage_type: {type: [string, 'null'], description: 'Тип использования адреса, например DCH для дата-центра; сам по себе не означает утечку.'}
        address_type: {$ref: '#/components/schemas/IPLookupText'}
        ads_category: {$ref: '#/components/schemas/IPLookupText'}
        ads_category_name: {$ref: '#/components/schemas/IPLookupText'}
        as_info:
          type: [object, 'null']
          additionalProperties: false
          required: [as_number, as_name, as_domain, as_usage_type, as_cidr]
          properties:
            as_number: {type: [integer, string, 'null'], minimum: 0, maximum: 4294967295, description: Число или исходная числовая строка в указанном диапазоне; неизвестное
                значение — null.}
            as_name: {$ref: '#/components/schemas/IPLookupText'}
            as_domain: {$ref: '#/components/schemas/IPLookupText'}
            as_usage_type: {$ref: '#/components/schemas/IPLookupText'}
            as_cidr: {$ref: '#/components/schemas/IPLookupText'}
        continent:
          type: [object, 'null']
          additionalProperties: false
          required: [name, code, hemisphere, translation]
          properties:
            name: {$ref: '#/components/schemas/IPLookupText'}
            code: {$ref: '#/components/schemas/IPLookupText'}
            hemisphere:
              type: [array, 'null']
              minItems: 1
              maxItems: 8
              items: {type: string, minLength: 1, maxLength: 2048}
            translation:
              type: [object, 'null']
              additionalProperties: false
              required: [lang, value]
              properties:
                lang: {$ref: '#/components/schemas/IPLookupText'}
                value: {$ref: '#/components/schemas/IPLookupText'}
        country:
          type: [object, 'null']
          additionalProperties: false
          required: [name, alpha3_code, numeric_code, demonym, flag, capital, total_area, population, currency, language, tld, translation]
          properties:
            name: {$ref: '#/components/schemas/IPLookupText'}
            alpha3_code: {$ref: '#/components/schemas/IPLookupText'}
            numeric_code: {type: [integer, string, 'null'], minimum: 0, maximum: 999, description: Число или исходная числовая строка в указанном диапазоне; неизвестное
                значение — null.}
            demonym: {$ref: '#/components/schemas/IPLookupText'}
            flag: {$ref: '#/components/schemas/IPLookupText'}
            capital: {$ref: '#/components/schemas/IPLookupText'}
            total_area: {type: [number, 'null'], minimum: 0, maximum: 1000000000000, description: Площадь страны; числовые строки провайдера нормализуются в JSON number.}
            population: {type: [integer, 'null'], minimum: 0, maximum: 1000000000000, description: Население; числовые строки провайдера нормализуются в JSON number.}
            currency:
              type: [object, 'null']
              additionalProperties: false
              required: [code, name, symbol]
              properties:
                code: {$ref: '#/components/schemas/IPLookupText'}
                name: {$ref: '#/components/schemas/IPLookupText'}
                symbol: {$ref: '#/components/schemas/IPLookupText'}
            language:
              type: [object, 'null']
              additionalProperties: false
              required: [code, name]
              properties:
                code: {$ref: '#/components/schemas/IPLookupText'}
                name: {$ref: '#/components/schemas/IPLookupText'}
            tld: {$ref: '#/components/schemas/IPLookupText'}
            translation:
              type: [object, 'null']
              additionalProperties: false
              required: [lang, value]
              properties:
                lang: {$ref: '#/components/schemas/IPLookupText'}
                value: {$ref: '#/components/schemas/IPLookupText'}
        region:
          type: [object, 'null']
          additionalProperties: false
          required: [name, code, translation]
          properties:
            name: {$ref: '#/components/schemas/IPLookupText'}
            code: {$ref: '#/components/schemas/IPLookupText'}
            translation:
              type: [object, 'null']
              additionalProperties: false
              required: [lang, value]
              properties:
                lang: {$ref: '#/components/schemas/IPLookupText'}
                value: {$ref: '#/components/schemas/IPLookupText'}
        city:
          type: [object, 'null']
          additionalProperties: false
          required: [name, translation]
          properties:
            name: {$ref: '#/components/schemas/IPLookupText'}
            translation:
              type: [object, 'null']
              additionalProperties: false
              required: [lang, value]
              properties:
                lang: {$ref: '#/components/schemas/IPLookupText'}
                value: {$ref: '#/components/schemas/IPLookupText'}
        time_zone_info:
          type: [object, 'null']
          additionalProperties: false
          required: [olson, current_time, gmt_offset, is_dst, abbreviation, dst_start_date, dst_end_date, sunrise, sunset]
          properties:
            olson: {$ref: '#/components/schemas/IPLookupText'}
            current_time: {$ref: '#/components/schemas/IPLookupText'}
            gmt_offset: {type: [integer, 'null'], minimum: -86400, maximum: 86400, description: Смещение UTC в секундах; числовые строки провайдера нормализуются в JSON number.}
            is_dst: {$ref: '#/components/schemas/IPLookupFlag'}
            abbreviation: {$ref: '#/components/schemas/IPLookupText'}
            dst_start_date: {$ref: '#/components/schemas/IPLookupText'}
            dst_end_date: {$ref: '#/components/schemas/IPLookupText'}
            sunrise: {$ref: '#/components/schemas/IPLookupText'}
            sunset: {$ref: '#/components/schemas/IPLookupText'}
        geotargeting:
          type: [object, 'null']
          additionalProperties: false
          required: [metro]
          properties:
            metro: {$ref: '#/components/schemas/IPLookupText'}
        is_proxy: {$ref: '#/components/schemas/IPLookupFlag'}
        fraud_score: {type: [integer, 'null'], minimum: 0, maximum: 99, description: Оценка риска IP2Location от 0 до 99; не оценка Claude и не гарантия доступа к сайтам.}
        proxy:
          type: [object, 'null']
          additionalProperties: false
          required: [last_seen, proxy_type, threat, provider, is_vpn, is_tor, is_data_center, is_public_proxy, is_web_proxy, is_web_crawler, is_ai_crawler, is_residential_proxy,
            is_consumer_privacy_network, is_enterprise_private_network, is_spammer, is_scanner, is_botnet, is_bogon]
          properties:
            last_seen: {type: [integer, 'null'], minimum: 0, maximum: 1000000000, description: Давность наблюдения в целых днях; null — неизвестно.}
            proxy_type: {$ref: '#/components/schemas/IPLookupText'}
            threat: {$ref: '#/components/schemas/IPLookupText'}
            provider: {$ref: '#/components/schemas/IPLookupText'}
            is_vpn: {$ref: '#/components/schemas/IPLookupFlag'}
            is_tor: {$ref: '#/components/schemas/IPLookupFlag'}
            is_data_center: {$ref: '#/components/schemas/IPLookupFlag'}
            is_public_proxy: {$ref: '#/components/schemas/IPLookupFlag'}
            is_web_proxy: {$ref: '#/components/schemas/IPLookupFlag'}
            is_web_crawler: {$ref: '#/components/schemas/IPLookupFlag'}
            is_ai_crawler: {$ref: '#/components/schemas/IPLookupFlag'}
            is_residential_proxy: {$ref: '#/components/schemas/IPLookupFlag'}
            is_consumer_privacy_network: {$ref: '#/components/schemas/IPLookupFlag'}
            is_enterprise_private_network: {$ref: '#/components/schemas/IPLookupFlag'}
            is_spammer: {$ref: '#/components/schemas/IPLookupFlag'}
            is_scanner: {$ref: '#/components/schemas/IPLookupFlag'}
            is_botnet: {$ref: '#/components/schemas/IPLookupFlag'}
            is_bogon: {$ref: '#/components/schemas/IPLookupFlag'}
      description: Закрытый набор полей IP2Location.io с исходными именами. Все разрешённые ключи возвращаются; недоступные поля и группы — null. География приблизительна,
        отметки не доказывают утечки или анонимность.
    Notification:
      type: object
      required: [id, category, title, body, created_at, read_at]
      properties:
        id: {type: string, format: uuid}
        category: {type: string, enum: [server, devices, configuration]}
        title: {type: string}
        body: {type: string}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, 'null'], format: date-time}
    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [server, devices, configuration]
      properties:
        server: {type: boolean, default: true, description: Состояние локальных служб и восстановление}
        devices: {type: boolean, default: true, description: Изменения устройств и доступа}
        configuration: {type: boolean, default: true, description: Применение конфигурации}
    NotificationPushDevice:
      type: object
      required: [id, endpoint_hash, device, created_at, last_sent_at]
      properties:
        id: {type: string, format: uuid}
        endpoint_hash: {type: string, pattern: '^[0-9a-f]{16}$', description: Первые 8 байт SHA-256 адреса доставки в hex}
        device: {type: string, maxLength: 80}
        created_at: {type: string, format: date-time}
        last_sent_at: {type: [string, 'null'], format: date-time}
    NotificationPushSubscription:
      type: object
      additionalProperties: false
      required: [endpoint, keys, device]
      properties:
        endpoint:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL FCM, Mozilla, Apple или Windows Push с непустым путём, без порта, userinfo, fragment, IP-адреса и редиректов.
        device: {type: string, minLength: 1, maxLength: 80, description: Непустая подпись браузера без управляющих символов}
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: {type: string, pattern: '^[A-Za-z0-9_-]{87}$', description: 65-байтный несжатый ключ на кривой P-256 в base64url без padding}
            auth: {type: string, pattern: '^[A-Za-z0-9_-]{22}$', description: 16-байтный секрет подписки в base64url без padding}
    ResourceDiagnostics:
      type: [object, 'null']
      description: Ограниченные показатели группы ресурсов; scope присутствует у API, отсутствует у вложенного vpn.cgroup.
      properties:
        scope: {type: string}
        memoryBytes: {type: [integer, 'null']}
        memoryLimitBytes: {type: [integer, 'null']}
        cpuQuotaCores: {type: [number, 'null']}
        cpuUsageUsec: {type: [integer, 'null']}
        cpuThrottledUsec: {type: [integer, 'null']}
        cpuThrottledPeriods: {type: [integer, 'null']}
    Node:
      type: object
      required: [id, name, host, port, server_name, public_key, short_id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        server_name: {type: string}
        public_key: {type: string}
        short_id: {type: string}
        xhttp:
          type: object
          description: Необязательные параметры дополнительного входа XHTTP; закрытый ключ сюда не входит
          required: [port, public_key, short_id, path, mode]
          properties:
            port: {type: integer, minimum: 1, maximum: 65535}
            public_key: {type: string}
            short_id: {type: string}
            path: {type: string}
            mode: {type: string, enum: [auto]}
    Device:
      type: object
      required: [id, node_id, name, created_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    AuditEvent:
      type: object
      required: [id, action, device_id, created_at]
      properties:
        id: {type: integer, format: int64}
        action: {type: string}
        device_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
    Status:
      type: object
      required: [database, node_id, devices, active_devices, desired_revision, applied_revision, xray_configured]
      properties:
        database: {type: string, enum: [ok]}
        node_id: {type: string, format: uuid}
        devices: {type: integer, minimum: 0}
        active_devices: {type: integer, minimum: 0}
        desired_revision: {type: integer, minimum: 1}
        applied_revision: {type: integer, minimum: 0}
        xray_configured: {type: boolean, description: 'Команда перезапуска задана; это не значит, что процесс Xray работает'}
