name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gateway_test
          POSTGRES_USER: gateway_test
          POSTGRES_PASSWORD: gateway-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_test -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://gateway_test:gateway-ci-only@127.0.0.1:5432/gateway_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install verified Xray
        run: bash scripts/install-xray.sh "$RUNNER_TEMP/xray"
      - name: Test Go and PostgreSQL integration
        env:
          PRIVATE_GATEWAY_REAL_XRAY_BINARY: ${{ runner.temp }}/xray/xray
        run: go test -race ./...
      - name: Vet Go
        run: go vet ./...
      - name: Build binaries
        run: go build ./cmd/...
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Test web interactions
        working-directory: web
        run: npm test
      - name: Test release artifact validation
        run: python3 scripts/test-release.py
      - name: Check Docker release scripts
        run: |
          bash -n scripts/build-release.sh deploy/docker/install.sh deploy/docker/update.sh \
            deploy/docker/bootstrap.sh deploy/docker/bootstrap-receiver.sh \
            scripts/test-first-deploy.sh
          python3 -m py_compile scripts/verify-release.py deploy/docker/*.py
          python3 scripts/test-release.py
      - name: Build production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: bash scripts/build-release.sh "$RUNNER_TEMP/release"
      - name: Build and validate Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p "$RUNNER_TEMP/docker-payload"
          tar -xzf "$RUNNER_TEMP/release/release.tar.gz" -C "$RUNNER_TEMP/docker-payload"
          for service in api xray browser; do
            docker build -f "$RUNNER_TEMP/docker-payload/docker/Dockerfile.$service" \
              -t "private-gateway/$service:ci" "$RUNNER_TEMP/docker-payload"
          done
          hash=$(docker run --rm --entrypoint caddy caddy:2.10.2-alpine \
            hash-password --plaintext ci-only-test-token)
          python3 - "$RUNNER_TEMP/docker-payload/docker/Caddyfile.template" \
            "$RUNNER_TEMP/Caddyfile" "$hash" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          Path(sys.argv[2]).write_text(text.replace('__PANEL_DOMAIN__', 'example.com')
                                           .replace('__BROWSER_AUTH_HASH__', sys.argv[3]))
          PY
          docker run --rm --cap-drop=ALL --cap-add=NET_BIND_SERVICE \
            --security-opt=no-new-privileges \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" \
            --entrypoint caddy caddy:2.10.2-alpine validate --config /etc/caddy/Caddyfile
          bash scripts/test-first-deploy.sh "$RUNNER_TEMP/release/release.tar.gz" private-gateway/api:ci
      - name: Validate Docker Compose configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          cat > "$RUNNER_TEMP/docker-test.env" <<'EOF'
          PG_RELEASE_SHA=0000000000000000000000000000000000000000
          POSTGRES_PASSWORD=dummy-password
          GATEWAY_API_TOKEN=dummy-api-token
          GATEWAY_MASTER_KEY=dummy-master-key
          GATEWAY_REALITY_PRIVATE_KEY=dummy-private-key
          GATEWAY_SHORT_ID=0123456789abcdef
          BROWSER_WORKER_TOKEN=dummy-browser-token
          GATEWAY_HOST=127.0.0.1
          PANEL_DOMAIN=example.com
          GATEWAY_STATE_DIR=/tmp/private-gateway-ci-xray
          GATEWAY_CADDYFILE=/tmp/private-gateway-ci-Caddyfile
          EOF
          docker compose --env-file "$RUNNER_TEMP/docker-test.env" \
            -f deploy/docker/compose.yml config --quiet
          python3 scripts/verify-release.py --tar "$RUNNER_TEMP/release/release.tar.gz"
      - name: Upload production release and installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: private-gateway-linux-amd64
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare one-time bootstrap bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          install -d "$RUNNER_TEMP/bootstrap"
          cp deploy/docker/bootstrap.sh "$RUNNER_TEMP/bootstrap/bootstrap.sh"
          cp deploy/docker/bootstrap-receiver.sh "$RUNNER_TEMP/bootstrap/bootstrap-receiver.sh"
          cp scripts/verify-release.py "$RUNNER_TEMP/bootstrap/verify-release.py"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/bootstrap/commit.sha"
          (cd "$RUNNER_TEMP/bootstrap" && sha256sum bootstrap.sh bootstrap-receiver.sh verify-release.py commit.sha > SHA256SUMS)
          (cd "$RUNNER_TEMP/bootstrap" && sha256sum -c SHA256SUMS)
      - name: Upload one-time bootstrap bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: private-gateway-bootstrap
          path: ${{ runner.temp }}/bootstrap/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy Docker to VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: private-gateway-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: private-gateway-linux-amd64
          path: ${{ runner.temp }}/release
      - name: Verify the successful CI release
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check release.tar.gz.sha256
          version=$(python3 "$GITHUB_WORKSPACE/scripts/verify-release.py" --tar release.tar.gz)
          test "$version" = "$GITHUB_SHA"
      - name: Deploy the current master commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in repository secrets}"
          : "${DEPLOY_USER:?Set DEPLOY_USER in repository secrets}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY in repository secrets}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in repository secrets}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          [[ $DEPLOY_PORT =~ ^[0-9]+$ ]] || exit 1
          latest=$(git ls-remote origin refs/heads/master | cut -f1)
          if [[ $latest != "$GITHUB_SHA" ]]; then
            echo 'A newer master commit exists; this release is superseded.'
            exit 0
          fi
          install -d -m 0700 "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/deploy-ssh/id_ed25519" "$RUNNER_TEMP/deploy-ssh/known_hosts"
          { printf '%s\n' "$GITHUB_SHA"; cat "$RUNNER_TEMP/release/release.tar.gz"; } | \
            ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/deploy-ssh/known_hosts" \
              -i "$RUNNER_TEMP/deploy-ssh/id_ed25519" -p "$DEPLOY_PORT" \
              "$DEPLOY_USER@$DEPLOY_HOST"
