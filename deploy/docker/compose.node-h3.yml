# Сертификат TLS/H3 остаётся в отдельном томе Caddy этого VPS.
services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:${GATEWAY_XHTTP_H3_PORT:-8444}:${GATEWAY_XHTTP_H3_PORT:-8444}/udp"
    volumes:
      - ${GATEWAY_CADDYFILE:?Set GATEWAY_CADDYFILE}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [xray-xhttp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  caddy-data: {}
  caddy-config: {}
